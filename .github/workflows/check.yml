name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  content:
    name: Content checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check-content.js
      - run: node tools/sync-test.mjs

  e2e:
    name: End-to-end test
    needs: content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.48.0
      - run: python -m playwright install --with-deps chromium
      - name: Run tests
        run: |
          python -m http.server 8765 >/dev/null 2>&1 &
          SRV=$!
          sleep 2
          python tools/e2e-test.py http://localhost:8765/
          kill $SRV
      - name: Run tests on the published form (content joined into one file)
        run: |
          mkdir _site
          cp -r index.html sw.js manifest.webmanifest css js data icons audio img _site/
          node tools/bundle.js _site
          (cd _site && python -m http.server 8765 >/dev/null 2>&1 &)
          sleep 2
          python tools/e2e-test.py http://localhost:8765/
