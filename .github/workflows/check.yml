name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  content:
    name: Content checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check-content.js

  e2e:
    name: End-to-end test
    needs: content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.48.0
      - run: python -m playwright install --with-deps chromium
      - name: Run tests
        run: |
          python -m http.server 8765 >/dev/null 2>&1 &
          sleep 2
          python tools/e2e-test.py http://localhost:8765/
